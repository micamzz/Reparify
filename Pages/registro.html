<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reparify – Registrarse</title>

    <meta name="robots" content="noindex, nofollow">

    <!-- CSS -->
    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/footer.css" />
    <link rel="stylesheet" href="../styles/registro.css" />
    <link rel="stylesheet" href="../styles/components.css">

    <!-- FUENTES -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
</head>

<body>

    <!-- HEADER -->
    <div id="nav-placeholder"></div>

    <!-- MAIN -->
    <main class="registro-main">
        <div class="registro-container">

            <!-- COLUMNA IZQUIERDA: texto -->
            <div class="registro-texto">
                <h1 class="registro-titulo">Crear una cuenta</h1>
                <p class="registro-subtitulo">Resuelve tus problemas con <span class="color-blue">Reparify</span></p>
            </div>

            <!-- COLUMNA CENTRAL: formulario -->
            <div class="registro-card">
                <h2 class="form-bienvenido">¡Bienvenido!</h2>
                <p class="form-desc">Ingresa tus datos para registrarte</p>

                <form id="formRegistro" novalidate>

                    <!-- Nombre completo -->
                    <div class="campo-grupo">
                        <label class="campo-label" for="nombre">Nombre completo</label>
                        <input class="campo-input" type="text" id="datosNombre" name="nombre"
                            placeholder="Nombre y apellido" />
                        <span class="campo-error" id="error-nombre"></span>
                    </div>
                    <!-- Email -->
                    <div class="campo-grupo">
                        <label class="campo-label" for="email">Email</label>
                        <input class="campo-input" type="text" id="email" name="email" placeholder="ejemplo@gmail.com"
                            autocomplete="email" />
                        <span class="campo-error" id="error-email"></span>
                    </div>

                    <!-- Contraseña -->
                    <div class="campo-grupo">
                        <label class="campo-label" for="password">Contraseña</label>
                        <div class="input-password-wrapper">
                            <input class="campo-input" type="password" id="password" name="password"
                                placeholder="············" autocomplete="new-password" />

                            <button type="button" class="toggle-pass" data-target="password"
                                aria-label="Ver contraseña">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="eye-slash-icon" style="display:none;" xmlns="http://www.w3.org/2000/svg"
                                    width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22" />
                                </svg>
                            </button>
                        </div>
                        <span class="campo-error" id="error-password"></span>
                    </div>

                    <!-- Repetir contraseña -->
                    <div class="campo-grupo">
                        <label class="campo-label" for="repetirPassword">Repetir contraseña</label>
                        <div class="input-password-wrapper">
                            <input class="campo-input" type="password" id="repetirPassword" name="repetirPassword"
                                placeholder="············" autocomplete="new-password" />

                            <button type="button" class="toggle-pass" data-target="repetirPassword"
                                aria-label="Ver contraseña">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="eye-slash-icon" style="display:none;" xmlns="http://www.w3.org/2000/svg"
                                    width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22" />
                                </svg>
                            </button>
                        </div>
                        <span class="campo-error" id="error-repetirPassword"></span>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn-registrar">Registrar</button>

                    <!-- Mensaje global  -->
                    <p class="form-mensaje" id="formMensaje"></p>

                </form>

                <p class="form-login-link">
                    ¿Ya tienes una cuenta?
                    <a href="./iniciarSesion.html">Inicia sesión</a>
                </p>
            </div>

            <!-- COLUMNA DERECHA: -->
            <div class="registro-imagen">
                <img src="../image/iniciarSesion-Registrarse/persona-parada.png" alt="Persona usando Reparify"
                    class="img-persona-registro" />
            </div>

        </div>
    </main>

    <!-- FOOTER SE CARGA CN JS-->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script type="module" src="../javascript/main.js"></script>
    <script type="module" src="../javascript/registro.js"></script>

</body>

</html>
